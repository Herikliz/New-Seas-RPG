        window.mensagensRodape = {
            "2026-06-04": `Tendo um den den mushi e utilizando em sua cena no ON o número de contato presente neste jornal, é possível aprender tudo que está presente na mensagem pré-gravada abaixo.<br><br>
            <button onclick="var d=document.getElementById('gravacao-emiri'); if(d.style.display==='none'){ d.style.display='block'; this.innerText='Ocultar Gravação'; } else { d.style.display='none'; this.innerText='Mostrar Gravação'; }" class="btn-toggle-nav" style="background: var(--sidebar-bg); border-color: var(--accent-color); color: var(--accent-color); font-weight: bold; cursor: pointer; padding: 8px 16px; font-size: 14px; margin-bottom: 10px; border-radius: 4px; transition: all 0.3s ease;">Mostrar Gravação</button>
            <div id="gravacao-emiri" style="display:none; text-align: justify; margin-top: 15px; font-family: 'Comfortaa', sans-serif; font-size: 15px; color: var(--text-color); background: rgba(0,0,0,0.1); padding: 25px; border-radius: 8px; border-left: 4px solid var(--accent-color); line-height: 1.6;">
                <p style="margin-bottom: 10px;">O som pesado dos blocos de gelo estalando e derretendo sob o sol quebrava o silêncio do oceano. O <i>Silent Mary</i> navegava com tranquilidade, deixando para trás a carcaça de um Rei do Mar. A criatura colossal, que minutos antes havia tentado engolir a embarcação, agora boiava destroçada, com o corpo rasgado por grandes estacas de gelo negro que começavam a desmanchar na água salgada.</p>
                <p style="margin-bottom: 10px;">No convés, Emiri apoiava uma das mãos na amurada. Ela estava ofegante, o ar saindo de seus lábios em lufadas que formavam uma névoa fria. O combate não havia sido demorado, mas aniquilar um monstro daquele tamanho exigia um grande esforço. Nagini, agora exibindo suas novas e brilhantes escamas furta-cor, rastejou pelo ombro da dona, sibilando de forma suave para confortá-la.</p>
                <p style="margin-bottom: 10px;">Emiri fechou os olhos por alguns minutos, deixando a brisa do mar acalmar sua respiração. Quando o cansaço diminuiu, ela abriu os olhos, com o foco perfeitamente afiado. A promessa que havia feito a Hyugan Drole ainda estava fresca em sua mente: ensinar o máximo de pessoas possível a se protegerem.</p>
                <p style="margin-bottom: 10px;">Caminhou até a cabine de navegação e voltou para o convés trazendo um Den Den Mushi visual. Alquiman, Bastian e Katanasuke observavam de longe, mantendo um silêncio respeitoso. Emiri posicionou o caracol sobre um barril de madeira, ajustando a lente com cuidado. Ela sentou-se de frente para o aparelho, o rosto pálido e sério focado diretamente em quem quer que fosse assistir àquilo.</p>
                <p style="margin-bottom: 10px;">Ela ativou a gravação.</p>
                <p style="margin-bottom: 10px;">— A Marinha e as grandes forças deste mar gostam de guardar o poder só para eles, deixando pessoas comuns indefesas — Emiri começou, a voz firme e direta, sem pressa. — Eu não gosto disso. Se vocês não querem continuar sendo esmagados por quem é mais forte, prestem atenção. Eu vou ensinar como despertar e usar o Haki: a força da sua própria vontade moldando o mundo.</p>
                <p style="margin-bottom: 10px;">Ela ergueu a mão direita na frente da lente.</p>
                <p style="margin-bottom: 10px;">— O Haki do Armamento é a sua vontade servindo como escudo e espada. Para despertá-lo, você precisa parar de pensar em tensionar os músculos. O corpo não aguenta tudo. Você precisa se concentrar na sensação absoluta de não querer ser ferido. Puxe essa vontade de dentro do peito e force-a a cobrir a sua pele como se fosse uma luva invisível.</p>
                <p style="margin-bottom: 10px;">Emiri pegou um canivete de metal afiado com a mão esquerda e o cravou com violência contra a palma da própria mão direita. A lâmina estalou e quebrou ao meio, sem deixar sequer uma marca na pele branca.</p>
                <p style="margin-bottom: 10px;">— Quando você consegue criar essa barreira, você alcança o Armamento Invisível. A pele continua igual, mas dura como ferro. Se você continuar treinando e empurrando essa vontade com ainda mais força para fora, condensando a energia, você atinge o Armamento Visível.</p>
                <p style="margin-bottom: 10px;">A mão de Emiri escureceu de imediato, coberta por um tom negro de brilho metálico. Ela esmagou os restos do canivete quebrado entre os dedos, amassando o aço como se fosse papel.</p>
                <p style="margin-bottom: 10px;">— Depois de dominar o próprio corpo, o próximo passo é a Imbuição. Pegue qualquer item. Para fortalecê-lo, você precisa parar de tratá-la como um objeto solto. A lâmina ou a madeira precisa se tornar uma extensão do seu braço. Empurre o seu Haki para dentro da arma até que ela escureça. — O Haki negro fluiu de sua mão para um cano de chumbo que pegou do chão, cobrindo-o de escuridão.</p>
                <p style="margin-bottom: 10px;">— Em situações de vida ou morte, você pode expandir essa armadura para o corpo inteiro, o Full Body. — Uma onda escura cobriu Emiri dos pés à cabeça por um segundo. — É uma defesa perfeita, mas cansa muito rápido. Use apenas em emergências. E, por fim, o estágio mais avançado que eu conheço por enquanto: a Emissão.</p>
                <p style="margin-bottom: 10px;">Ela fez a armadura escura sumir. Emiri flexionou o braço e deu um soco no ar, em direção a uma caixa pesada a três metros de distância. O ar estalou. A caixa explodiu em pedaços antes que o punho dela sequer chegasse perto.</p>
                <p style="margin-bottom: 10px;">— Para fazer a Emissão, não tente apenas cobrir a pele. Você tem que querer afastar o perigo antes que ele te toque. Projete a sua vontade para o ar ao seu redor, forçando a sua armadura a agir como uma parede invisível que ataca de longe. É menos cansativo que o Full Body e muito mais letal.</p>
                <p style="margin-bottom: 10px;">Emiri pegou uma tira de pano e amarrou sobre os próprios olhos, ficando completamente vendada.</p>
                <p style="margin-bottom: 10px;">— O segundo tipo é a Observação. O segredo para despertar isso é o silêncio. Feche os olhos. Pare de tentar ouvir os passos ou o vento com os seus ouvidos. Concentre-se na presença. A vida emite uma energia invisível. Quando você sentir o peso das pessoas ao seu redor sem precisar olhar para elas, você dominou a base da Observação.</p>
                <p style="margin-bottom: 10px;">Sem qualquer aviso, Bastian lançou uma maçã inteira na direção do rosto dela. Emiri apenas moveu a cabeça alguns centímetros para o lado, e a maçã passou direto.</p>
                <p style="margin-bottom: 10px;">— Quando a base se tornar natural, foque na Intenção. Você não vai ler a mente de ninguém, mas vai começar a sentir o que a pessoa quer fazer. A raiva e a vontade de matar são sentimentos pesados e barulhentos. Se você sentir a intenção do soco antes do braço se mover, você nunca será acertado.</p>
                <p style="margin-bottom: 10px;">Ainda de olhos vendados, Emiri ergueu a mão aberta no ar exatos dois segundos antes de Alquiman resolver atirar uma pequena porca de metal. O garoto jogou a peça, que caiu perfeitamente no centro da mão dela.</p>
                <p style="margin-bottom: 10px;">— Se você limpar a sua mente de qualquer distração ou barulho interno, a intenção fica tão clara que você alcança a Premonição. O seu espírito vê o que vai acontecer alguns milésimos de segundo no futuro. Você não precisa ser o mais rápido da luta, basta já estar parado onde o golpe do inimigo vai tentar chegar.</p>
                <p style="margin-bottom: 10px;">Emiri tirou a venda, olhando diretamente para a câmera do caracol com um olhar afiado e avassalador.</p>
                <p style="margin-bottom: 10px;">— O último é o Haki Imperial. Vocês não podem treinar para despertar isso; é algo com o qual se nasce. Mas estou ensinando para que saibam se defender.</p>
                <p style="margin-bottom: 10px;">Um grande pássaro marinho desceu do céu e pousou na amurada do navio, grasnando e abrindo as asas de forma ameaçadora para Nagini. Emiri não se moveu, apenas cravou os olhos na ave.</p>
                <p style="margin-bottom: 10px;">— O primeiro nível é a Dominação. É a imposição absoluta da sua autoridade sobre os instintos de um animal. Você foca a sua presença neles, e eles entendem que você manda. — A ave travou no mesmo instante, perdendo a postura agressiva e encolhendo as asas, completamente dócil.</p>
                <p style="margin-bottom: 10px;">— Se você soltar essa autoridade não apenas em um alvo, mas no ambiente inteiro, você faz a Incapacitação. Pessoas e animais com o espírito fraco ou que não têm força de vontade não aguentam o peso da sua existência.</p>
                <p style="margin-bottom: 10px;">Emiri liberou uma onda curta e invisível de presença no ar. O ar ficou espesso por um instante. O pássaro tombou duro no convés, completamente desmaiado. Katanasuke e Alquiman deram um passo para trás, sentindo as pernas tremerem antes de ela puxar a energia de volta.</p>
                <p style="margin-bottom: 10px;">— E se o seu espírito for pesado o bastante, você atinge a Pressão. O Haki Imperial se torna tão forte que ele não quebra apenas a mente de quem é fraco, ele quebra o mundo ao seu redor de forma bem mais literal.</p>
                <p style="margin-bottom: 10px;">O ar em volta de Emiri pareceu faiscar com uma energia vermelha. A madeira do barril ao lado dela começou a rachar sozinha, partindo-se ao meio sob o peso da presença dela, sem que um único dedo a tocasse.</p>
                <p style="margin-bottom: 10px;">— Se encontrarem alguém usando o Haki Imperial contra vocês, só a sua própria força de vontade os manterá de pé. Se não tiverem vontade o bastante para resistir, corram antes de desmaiar.</p>
                <p style="margin-bottom: 10px;">Ela estendeu a mão em direção ao Den Den Mushi.</p>
                <p style="margin-bottom: 10px;">— Eu expliquei o caminho. Agora, parem de depender de heróis e comecem a treinar suas próprias vontades. Lembrem-se que eu sou uma pirata, não me manterei parada; um dia, posso tentar dominar sua casa. O que você vai fazer nesse dia? Ficar parado? Chorar? Torcer para que alguém te salve?! O que você deve realmente fazer é deixar de ser um inútil!</p>
                <p style="margin-bottom: 10px;">Emiri tocou no caracol e encerrou a gravação. Com movimentos ágeis, ela alterou os fios e configurações do aparelho, ativando um comando de repetição infinita. O vídeo começaria a tocar e a transmitir o sinal de forma contínua, em loop.</p>
                <p style="margin-bottom: 10px;">Enquanto ela fazia isso, o nevoeiro e o clima calmo do oceano deram lugar a um imenso paredão de pedras cobertas por uma selva muito densa. O <i>Silent Mary</i> finalmente chegava à ilha que há tanto tempo se escondera no Calm Belt: Amazon Lily.</p>
                <p style="margin-bottom: 10px;">Emiri virou-se para Alquiman, Bastian e Katanasuke, ajeitando o casaco no corpo enquanto a âncora do navio descia com um baque surdo nas águas.</p>
                <p style="margin-bottom: 10px;">— Eu entrei em contato com o jornal recentemente — ela avisou, com a voz calma, ignorando o pássaro que ainda dormia no chão. — Eles vão divulgar o número de sinal desse Den Den Mushi na próxima edição. Qualquer pessoa no mundo que tiver um receptor vai poder sintonizar e aprender o que eu acabei de gravar. Sem precisar implorar por professores.</p>
                <p style="margin-bottom: 0;">O navio estava ancorado. Emiri olhou para a costa da ilha que costumava ser o seu lar, trazendo consigo uma tripulação desajustada, uma filha colorida no ombro e um conhecimento que, muito em breve, estaria nas mãos de qualquer um que quisesse ouvir.</p>
