<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Restrita Administrativa - New Seas OP</title>
    <link href="https://fonts.googleapis.com/css?family=Quantico:700|Comfortaa:400,700|Verdana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .admin-generator-box {
            background-color: var(--bg-color);
            border: 2px solid var(--sidebar-border);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-top: 20px;
        }
        .admin-generator-box .input-group {
            margin-bottom: 20px;
        }
        .admin-generator-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-color);
            font-family: 'Quantico', sans-serif;
        }
        .admin-generator-box input[type="text"], .admin-generator-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--sidebar-border);
            border-radius: var(--border-radius);
            background-color: var(--sidebar-bg);
            color: var(--text-color);
            font-family: 'Comfortaa', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .admin-generator-box input[type="text"]:focus, .admin-generator-box select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }
        .admin-checkbox-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .admin-checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
            color: var(--text-color);
            font-family: 'Comfortaa', sans-serif;
        }
        .admin-checkbox-group input[type="checkbox"], .admin-checkbox-group input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }
        .output-container {
            background-color: var(--sidebar-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            border: 1px solid var(--sidebar-border);
            margin-bottom: 20px;
            min-height: 120px;
            color: var(--text-color);
        }
        .output-container pre {
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .btn-admin {
            width: 100%;
            padding: 15px;
            background-color: var(--sidebar-bg);
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Quantico', sans-serif;
            transition: all 0.3s ease;
        }
        .btn-admin:hover {
            background-color: var(--accent-color);
            color: var(--sidebar-bg);
        }
        .btn-clear-admin {
            background-color: transparent;
            color: var(--text-color);
            border: 1px dashed var(--sidebar-border);
            padding: 8px 15px;
            border-radius: var(--border-radius);
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
            font-family: 'Comfortaa', sans-serif;
            transition: all 0.3s ease;
        }
        .btn-clear-admin:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle-btn"> </button>
    <div id="sidebar-container"></div>

    <div style="position: fixed; bottom: 80px; right: 20px; z-index: 9999;">
        <button id="toggle-all-btn" class="copy-btn" style="box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);">Retrair Tudo</button>
    </div>

    <main class="main-content">
        <div class="content-wrapper">
            <section class="content-section text-center">
                <h1 class="title-quantico" style="font-size: 42px; color: var(--accent-color);">ÁREA RESTRITA</h1>
            </section>

            <div class="geo-layout">
                <div class="rank-box">
                    <h2 class="title-quantico rank-title toggle-title" style="font-size: 26px; border: none; padding: 0; margin-top: 30px; cursor: pointer;">
                        RECOMPENSAS DE EXTRA-NARRADA <span class="toggle-icon">▼</span>
                    </h2>
                    
                    <div class="toggle-content">
                        <div class="admin-generator-box" id="admin-generator-extra">
                        <div class="input-group">
                            <label for="pontosBase">Pontos de Atributo</label>
                            <input type="text" id="pontosBase" placeholder="Ex: 2.000">
                        </div>

                        <div class="admin-checkbox-group">
                            <label><input type="checkbox" id="checkHaki"> Tem Haki?</label>
                            <label><input type="checkbox" id="checkAkuma"> Tem Fruta?</label>
                            <label><input type="checkbox" id="check40k"> Tem 40.000 pontos ou mais?</label>
                        </div>

                        <div class="input-group">
                            <label>Barco Conquistado</label>
                            <div class="admin-checkbox-group" id="radios-barco">
                                <label><input type="radio" name="barco" value="Bote"> Bote</label>
                                <label><input type="radio" name="barco" value="Barco Pesqueiro"> Barco Pesqueiro</label>
                                <label><input type="radio" name="barco" value="Escuna"> Escuna</label>
                                <label><input type="radio" name="barco" value="Brigue"> Brigue</label>
                                <label><input type="radio" name="barco" value="Caravela"> Caravela</label>
                            </div>
                            <button class="btn-clear-admin" id="btn-clear-barco">Desmarcar Barco</button>
                        </div>

                        <div class="input-group">
                            <label for="linhagem">Linhagem Descoberta</label>
                            <select id="linhagem">
                                <option value="">Nenhuma</option>
                                <option value="Augur">Augur</option>
                                <option value="Barnum">Barnum</option>
                                <option value="Beckman">Beckman</option>
                                <option value="Boa">Boa</option>
                                <option value="Capone">Capone</option>
                                <option value="Charlotte">Charlotte</option>
                                <option value="Chinjao">Chinjao</option>
                                <option value="D.">D.</option>
                                <option value="Donquixote">Donquixote</option>
                                <option value="Dracule">Dracule</option>
                                <option value="Drole">Drole</option>
                                <option value="Família do Sol">Família do Sol</option>
                                <option value="Figarland">Figarland</option>
                                <option value="Gan">Gan</option>
                                <option value="Kong">Kong</option>
                                <option value="Kozuki">Kozuki</option>
                                <option value="Kurozumi">Kurozumi</option>
                                <option value="Laufey">Laufey</option>
                                <option value="Mokomo">Mokomo</option>
                                <option value="Nefertari">Nefertari</option>
                                <option value="Neptune">Neptune</option>
                                <option value="Newgate">Newgate</option>
                                <option value="Nico">Nico</option>
                                <option value="Sakazuki">Sakazuki</option>
                                <option value="Silvers">Silvers</option>
                                <option value="Tom">Tom</option>
                                <option value="Vega">Vega</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="npcNome">NPC Especial</label>
                            <input type="text" id="npcNome" placeholder="Nome do NPC">
                        </div>

                        <div class="output-container">
                            <pre id="resultado"></pre>
                        </div>

                        <button id="btn-copiar-resultado" class="btn-admin">Copiar Resultado</button>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
